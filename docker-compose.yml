# Everything needed to run Kept on one machine: database, web app and background worker.
#   cp .env.example .env     # set APP_URL, APP_SECRET and any keys you have
#   docker compose up -d --build
#   docker compose exec web npm run db:seed -- --demo   # optional: demo businesses (development only)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kept
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kept-change-me}
      POSTGRES_DB: kept
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kept"]
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        LOCAL_HTTP: ${LOCAL_HTTP:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
      # Written by compartir-link: the public https address of the share tunnel.
      - path: .env.share
        required: false
    environment:
      DATABASE_URL: postgres://kept:${DB_PASSWORD:-kept-change-me}@db:5432/kept
      STORAGE_DIR: /app/storage
      # Set to 1 by start-local to run on http://localhost (cookies and https upgrades are relaxed only for localhost).
      LOCAL_HTTP: ${LOCAL_HTTP:-}
    ports:
      - "3000:3000"
    volumes:
      - files:/app/storage

  worker:
    build:
      context: .
      args:
        LOCAL_HTTP: ${LOCAL_HTTP:-}
    restart: unless-stopped
    depends_on:
      - web
    env_file:
      - path: .env
      - path: .env.share
        required: false
    environment:
      DATABASE_URL: postgres://kept:${DB_PASSWORD:-kept-change-me}@db:5432/kept
      STORAGE_DIR: /app/storage
      LOCAL_HTTP: ${LOCAL_HTTP:-}
    command: ["npm", "run", "worker"]
    volumes:
      - files:/app/storage

  # Public https link without an account (compartir-link). Only starts with --profile share.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["share"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:3000"]

volumes:
  dbdata:
  files:
